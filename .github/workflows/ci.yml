name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  AUTH_SECRET: ci-secret-that-is-at-least-32-characters-long

jobs:
  check:
    name: Typecheck, lint, unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test tests

  database:
    name: Row level security + worker (PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - name: Start throwaway PostgreSQL and migrate
        run: |
          bun scripts/test-db.ts start > test-db.log 2>&1 &
          for i in $(seq 1 60); do grep -q TEST_DATABASE_URL test-db.log && break; sleep 2; done
          cat test-db.log
      - run: bun test tests/rls.db.test.ts
        env:
          TEST_DATABASE_URL: postgresql://app:app@127.0.0.1:54329/nexecoms_test

  e2e:
    name: E2E, accessibility and visual diff (Playwright)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bunx playwright install --with-deps chromium
      - name: Start throwaway PostgreSQL and migrate
        run: |
          bun scripts/test-db.ts start > test-db.log 2>&1 &
          for i in $(seq 1 60); do grep -q TEST_DATABASE_URL test-db.log && break; sleep 2; done
      - run: bunx playwright test
        env:
          TEST_DATABASE_URL: postgresql://app:app@127.0.0.1:54329/nexecoms_test
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:54329/nexecoms_test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report }

  lighthouse:
    name: Performance budget (Lighthouse CI)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - name: Start throwaway PostgreSQL, migrate, seed the demo store
        run: |
          bun scripts/test-db.ts start > test-db.log 2>&1 &
          for i in $(seq 1 60); do grep -q TEST_DATABASE_URL test-db.log && break; sleep 2; done
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54329/nexecoms_test SEED_DESIGN_DEMO=1 bun prisma/seed-design.ts
      - name: Build and start
        run: |
          bun run build
          PORT=3100 HOSTNAME=0.0.0.0 bun .next/standalone/server.js > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://demo.localhost:3100/robots.txt && break; sleep 2; done
        env:
          DATABASE_URL: postgresql://app:app@127.0.0.1:54329/nexecoms_test
      - run: npx --yes @lhci/cli@0.14.x autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lighthouse, path: .lighthouseci }
